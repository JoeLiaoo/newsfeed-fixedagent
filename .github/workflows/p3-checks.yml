name: P3 checks
on:
  pull_request:
    paths:
      - "modules/membership/**"
      - "site/modules/**"
      - "database/migrations/**"
      - "apps/**"
      - "packages/backend/**"
      - "packages/contracts/**"
      - "industry/**"
      - "scripts/**"
      - "package*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/p3-checks.yml"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/check-migrations.ts --base=origin/main
      - run: npm run typecheck
      - run: npm run build -w @aihot/web
      - run: node --import ./tests/standalone.ts --test --test-skip-pattern='every table and column' tests/architecture.test.ts
      - run: node --test apps/web/tests/nav-groups.test.ts
      - run: node --import ./tests/standalone.ts --test tests/request-context.standalone.test.ts modules/membership/tests/gp-core.standalone.test.ts modules/membership/tests/gp-source.standalone.test.ts modules/membership/tests/gp-admin-state.standalone.test.ts modules/membership/tests/gp-projects-state.standalone.test.ts modules/membership/tests/experts.standalone.test.ts modules/membership/tests/expert-coming-soon.standalone.test.ts modules/membership/tests/sector-peer-board.standalone.test.ts modules/membership/tests/task-detail-page.standalone.test.ts modules/membership/tests/expert-task-page.standalone.test.ts modules/membership/tests/task-query.standalone.test.ts modules/membership/tests/panorama.standalone.test.ts modules/membership/tests/experts-search.standalone.test.ts modules/membership/tests/sources-errors.standalone.test.ts modules/membership/tests/source-check-abort.standalone.test.ts modules/membership/tests/source-host-alias.standalone.test.ts modules/membership/tests/source-check-concurrency.standalone.test.ts modules/membership/tests/interests-state.standalone.test.ts modules/membership/tests/provider-pages.standalone.test.ts modules/membership/tests/platform-prompts.standalone.test.ts modules/membership/tests/notifications-core.standalone.test.ts modules/membership/tests/ilink-protocol.standalone.test.ts modules/membership/tests/scan-state.standalone.test.ts modules/membership/tests/knowledge-core.standalone.test.ts
      - run: docker build --tag newsfeed-review-check:${{ github.sha }} .

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/p3_schema_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --test-global-setup=tests/databases.ts --import ./tests/databases.ts --test modules/membership/tests/expert-tasks-page.test.ts modules/membership/tests/account-artifacts.test.ts modules/membership/tests/p3-db.test.ts modules/membership/tests/gp-projects-access.test.ts modules/membership/tests/gp-admin-access.test.ts modules/membership/tests/access-contract.test.ts modules/membership/tests/experts-access.test.ts modules/membership/tests/expert-task-detail.test.ts modules/membership/tests/expert-catalog-hidden.test.ts modules/membership/tests/expert-catalog-coming-soon.test.ts modules/membership/tests/expert-catalog-seed.test.ts modules/membership/tests/panorama-db.test.ts modules/membership/tests/notifications-access.test.ts modules/membership/tests/ilink-binding.test.ts modules/membership/tests/ilink-scan.test.ts modules/membership/tests/source-check.test.ts modules/membership/tests/source-host-alias.test.ts modules/membership/tests/knowledge-access.test.ts modules/membership/tests/knowledge-bases.test.ts modules/membership/tests/knowledge-answer-history.test.ts tests/architecture.test.ts
