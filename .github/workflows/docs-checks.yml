name: Docs checks
on:
  pull_request:
    paths:
      - "**/*.md"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs-checks.yml"
      - "scripts/check-doc-links.ts"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/docs-checks.yml"
      - "scripts/check-doc-links.ts"
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-doc-links.ts
